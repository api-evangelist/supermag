name: supermag
description: >-
  Suzhou Supermag Intelligent Technology Co., Ltd. is a Chinese deep-tech
  manufacturer specializing in magnetic levitation (maglev) motion and
  fluid-handling systems. Its product lines include SCM maglev wafer turntables
  for ultra-clean semiconductor rotation, SCP maglev pumps for contamination-free
  fluid transport, MSS maglev stirring systems for low-shear mixing, and SCT
  maglev turbomolecular pumps for high-vacuum applications, serving the
  semiconductor, biopharmaceutical, chemical, and energy industries. Backed by
  Qiming Venture Partners, the company markets physical industrial hardware and
  publishes no public developer API, documentation, or SDK surface at this time.
